<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Hub - Legal Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #B388FF; /* Vibrant Purple */
            --secondary: #00D084; /* Premium Emerald */
            --bg-deep: #050505; /* Deep Black (matches App darkSurface) */
            --bg-accent: #0D0D0D; 
            --text: #FBFBFB;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(at 0% 0%, rgba(179, 136, 255, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 208, 132, 0.05) 0px, transparent 50%);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow-x: hidden;
        }

        .container {
            max-width: 500px;
            width: 90%;
            padding: 48px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.8);
            animation: slideUp 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-container {
            width: 80px;
            height: 80px;
            background: #fff;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 32px;
            box-shadow: 0 10px 30px rgba(179, 136, 255, 0.3);
            transform: rotate(-5deg);
            overflow: hidden;
        }

        .logo-icon {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 900;
            margin: 0;
            letter-spacing: -1.5px;
            background: linear-gradient(to bottom right, #ffffff 30%, rgba(255,255,255,0.5));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            font-size: 1rem;
            color: rgba(251, 251, 251, 0.4);
            margin: 12px 0 48px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            padding: 20px 32px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid transparent;
        }

        .btn-primary {
            background: #ffffff;
            color: #000;
        }

        .btn-primary:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 20px 40px rgba(255, 255, 255, 0.15);
        }

        .btn-secondary {
            background: var(--bg-accent);
            color: #fff;
            border: 1px solid var(--glass-border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
            border-color: var(--primary);
        }

        .footer {
            margin-top: 64px;
            font-size: 0.8rem;
            color: rgba(251, 251, 251, 0.3);
            line-height: 1.8;
        }

        .footer a {
            color: var(--secondary);
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .footer a:hover {
            opacity: 0.8;
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <img src="app_icon.jpg" alt="Expense Hub Logo" class="logo-icon">
        </div>

        <h1>Expense Hub</h1>
        <p class="tagline">Legal & Compliance Hub</p>

        <div class="links-container">
            <a href="privacy.html" class="btn btn-primary">
                Privacy Policy
            </a>
            <a href="terms.html" class="btn btn-secondary">
                Terms of Service
            </a>
        </div>

        <div class="footer">
            <p>Made for smart savers</p>
            <p>Support: <a href="mailto:support.expensehub@gmail.com">support.expensehub@gmail.com</a></p>
            <p style="margin-top: 24px;">© 2026 Expense Hub. All rights reserved.</p>
        </div>
    </div>

</body>
</html>

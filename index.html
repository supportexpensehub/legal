<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Hub - Legal Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #7E57C2; /* App Primary Purple */
            --secondary: #00D084; /* Premium Emerald */
            --bg: #FFFFFF;
            --text: #1A1A1A;
            --text-muted: #6B7280;
            --surface: #F9FAFB;
            --border: #E5E7EB;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            max-width: 480px;
            width: 90%;
            padding: 48px;
            background: var(--bg);
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-container {
            width: 88px;
            height: 88px;
            background: var(--surface);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 32px;
            box-shadow: 0 10px 20px rgba(126, 87, 194, 0.1);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .logo-icon {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            margin: 0;
            letter-spacing: -1.5px;
            color: var(--text);
        }

        .tagline {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin: 8px 0 40px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            padding: 18px 32px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 10px 25px rgba(126, 87, 194, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(126, 87, 194, 0.4);
            background: #6A49AD;
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: #f3f4f6;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 56px;
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <img src="app_icon.jpg" alt="Expense Hub Logo" class="logo-icon">
        </div>

        <h1>Expense Hub</h1>
        <p class="tagline">Legal & Compliance Hub</p>

        <div class="links-container">
            <a href="privacy.html" class="btn btn-primary">
                Privacy Policy
            </a>
            <a href="terms.html" class="btn btn-secondary">
                Terms of Service
            </a>
        </div>

        <div class="footer">
            <p>Made for smart savers</p>
            <p>Support: <a href="mailto:support.expensehub@gmail.com">support.expensehub@gmail.com</a></p>
            <p style="margin-top: 24px;">© 2026 Expense Hub. All rights reserved.</p>
        </div>
    </div>

</body>
</html>

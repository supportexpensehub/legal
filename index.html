<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Information - SpendScape</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,600;1,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #315C49;
            --primary-soft: #D8ECD8;
            --gold: #B28B4A;
            --purple: #7E57C2;
            --bg: #F6F7FB;
            --surface: #FFFDFA;
            --text: #1E211E;
            --text-muted: #7D8178;
            --border: #D9D4C9;
            --shadow: 0 20px 50px rgba(30, 33, 30, 0.08);
            --shadow-soft: 0 10px 30px rgba(30, 33, 30, 0.06);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #5E9E7A;
                --primary-soft: #1A2E22;
                --gold: #D4A86A;
                --purple: #9B72CB;
                --bg: #0D0D0B;
                --surface: #161614;
                --text: #E8E4DC;
                --text-muted: #8A8E84;
                --border: #2A2A26;
                --shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
                --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.35);
            }
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.6;
        }

        .container {
            max-width: 520px;
            width: 90%;
            padding: 48px 40px;
            background: var(--surface);
            border-radius: 28px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-container {
            width: 88px;
            height: 88px;
            background: var(--primary-soft);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 28px;
            box-shadow: var(--shadow-soft);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .logo-icon {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-weight: 700;
            font-size: 2.5rem;
            letter-spacing: -0.5px;
            margin: 0;
            color: var(--primary);
        }

        .tagline {
            font-size: 1rem;
            color: var(--text-muted);
            margin: 6px 0 36px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            padding: 18px 32px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
            box-shadow: var(--shadow-soft);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow);
            filter: brightness(1.05);
        }

        .btn-secondary {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--primary-soft);
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 44px;
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.7;
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s ease;
        }

        .footer a:hover { border-bottom-color: var(--primary); }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <img src="app_icon.jpg" alt="SpendScape Logo" class="logo-icon">
        </div>

        <h1 class="brand">SpendScape</h1>
        <p class="tagline">Legal &amp; Compliance Hub</p>

        <div class="links-container">
            <a href="privacy.html" class="btn btn-primary">
                Privacy Policy
            </a>
            <a href="terms.html" class="btn btn-secondary">
                Terms of Service
            </a>
        </div>

        <div class="footer">
            <p>Made for smart savers</p>
            <p>Support: <a href="mailto:apphelpdesk.support@gmail.com">apphelpdesk.support@gmail.com</a></p>
            <p style="margin-top: 20px;">&copy; 2026 SpendScape. All rights reserved.</p>
        </div>
    </div>

</body>
</html>

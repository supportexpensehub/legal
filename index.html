<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Hub - Smart AI Finance Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10B981; /* Emerald Green */
            --bg-deep: #0F0C29; /* Deep Space */
            --bg-mid: #302b63;
            --bg-light: #24243e;
            --text: #ffffff;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-deep), var(--bg-mid), var(--bg-light));
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow-x: hidden;
        }

        .container {
            max-width: 600px;
            width: 90%;
            padding: 40px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 40px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-container {
            width: 100px;
            height: 100px;
            background: rgba(16, 185, 129, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .logo-icon {
            font-size: 50px;
            color: white;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            margin: 0;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.6);
            margin: 12px 0 40px;
            font-weight: 500;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            padding: 18px 32px;
            border-radius: 18px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: var(--primary);
            color: #000;
            box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px -5px rgba(16, 185, 129, 0.5);
            filter: brightness(1.1);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid var(--glass-border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 48px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.4);
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .footer p { margin: 4px 0; }

        /* Icon Font Placeholder (Using Emoji for zero dependencies) */
        .emoji { vertical-align: middle; margin-right: 8px; }

    </style>
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <span class="logo-icon">💰</span>
        </div>

        <h1>Expense Hub</h1>
        <p class="tagline">Smart AI Finance Manager</p>

        <div class="links-container">
            <a href="privacy.html" class="btn btn-primary">
                View Privacy Policy
            </a>
            <a href="terms.html" class="btn btn-secondary">
                Terms of Service
            </a>
        </div>

        <div class="footer">
            <p>Made with ❤️ for smart savers</p>
            <p>Support: <a href="mailto:support.expensehub@gmail.com">support.expensehub@gmail.com</a></p>
            <p style="margin-top: 20px; font-size: 0.75rem;">© 2026 Expense Hub. All rights reserved.</p>
        </div>
    </div>

</body>
</html>
